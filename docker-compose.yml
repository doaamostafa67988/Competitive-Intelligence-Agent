version: "3.9"

services:
  neo4j:
    image: neo4j:5.25-community
    environment:
      NEO4J_AUTH: neo4j/changeme
    ports:
      - "7474:7474"   # browser UI
      - "7687:7687"   # bolt
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  qdrant:
    image: qdrant/qdrant:v1.11.3
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: competitive_intel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  mcp-server:
    build:
      context: ./backend
      dockerfile: Dockerfile.mcp
    env_file: ./backend/.env
    # Explicit DNS: this container talks to api.telegram.org over the
    # internet (unlike the other services, which only talk to each other
    # inside the compose network). Docker Desktop's default DNS forwarding
    # can fail to resolve external hostnames in some network setups
    # ("[Errno -5] No address associated with hostname") — pointing at
    # public resolvers directly fixes that.
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "8765:8765"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: ./backend/.env
    depends_on:
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      mcp-server:
        condition: service_started
    ports:
      - "8000:8000"

  frontend-streamlit:
    build:
      context: ./frontend-streamlit
    environment:
      BACKEND_API_URL: http://backend:8000/api/v1
    depends_on:
      - backend
    ports:
      - "8501:8501"

  frontend-next:
    build:
      context: ./frontend-next
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8000/api/v1
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  neo4j_data:
  qdrant_data:
  postgres_data:
